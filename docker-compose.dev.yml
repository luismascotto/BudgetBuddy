    networks:
      - budgetbuddy-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetbuddy -d budgetbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BudgetBuddy Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: budgetbuddy-app-dev
