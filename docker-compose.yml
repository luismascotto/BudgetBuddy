version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: budgetbuddy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: budgetbuddy
      POSTGRES_USER: budgetbuddy
      POSTGRES_PASSWORD: budgetbuddy123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - budgetbuddy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetbuddy -d budgetbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BudgetBuddy Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgetbuddy-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://budgetbuddy:budgetbuddy123@postgres:5432/budgetbuddy
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - budgetbuddy-network
    volumes:
      - ./shared:/app/shared
      - ./server:/app/server
      - ./client:/app/client
      - ./drizzle.config.ts:/app/drizzle.config.ts
